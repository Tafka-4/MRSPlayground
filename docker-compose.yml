services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    cpuset: "3"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      gallery-api:
        condition: service_started
      post-api:
        condition: service_started
      comment-api:
        condition: service_started
      emoji-api:
        condition: service_started
      novel-api:
        condition: service_started
      user-api:
        condition: service_started
      user:
        condition: service_started
      research-frontend:
        condition: service_started
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/health || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 90s

  # Gallery Microservice
  gallery-api:
    build:
      context: ./gallery-api
      dockerfile: Dockerfile
    expose:
      - '5001'
    cpuset: "1"
    environment:
      - NODE_ENV=${NODE_ENV}
      - USER_SERVICE_URL=${USER_SERVICE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - MONGO_URI=${MONGO_URI}
      - MONGO_USER=${MONGO_USER}
      - MONGO_PW=${MONGO_PW}
      - REDIS_URL=${REDIS_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      user-api:
        condition: service_started
      redis:
        condition: service_started
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    volumes:
      - novel_uploads:/app/uploads

  # Post Microservice
  post-api:
    build:
      context: ./post-api
      dockerfile: Dockerfile
    expose:
      - '5003'
    cpuset: "1"
    environment:
      - NODE_ENV=${NODE_ENV}
      - USER_SERVICE_URL=${USER_SERVICE_URL}
      - GALLERY_API_URL=http://gallery-api:5001
      - JWT_SECRET=${JWT_SECRET}
      - MONGO_URI=${MONGO_URI}
      - MONGO_USER=${MONGO_USER}
      - MONGO_PW=${MONGO_PW}
      - REDIS_URL=${REDIS_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      gallery-api:
        condition: service_started
      redis:
        condition: service_started
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    volumes:
      - novel_uploads:/app/uploads

  # Comment Microservice
  comment-api:
    build:
      context: ./comment-api
      dockerfile: Dockerfile
    expose:
      - '5004'
    cpuset: "1"
    environment:
      - NODE_ENV=${NODE_ENV}
      - USER_SERVICE_URL=${USER_SERVICE_URL}
      - GALLERY_API_URL=http://gallery-api:5001
      - POST_API_URL=http://post-api:5003
      - NOVEL_API_URL=http://novel-api:5002
      - EMOJI_API_URL=http://emoji-api:5005
      - JWT_SECRET=${JWT_SECRET}
      - MONGO_URI=${MONGO_URI}
      - MONGO_USER=${MONGO_USER}
      - MONGO_PW=${MONGO_PW}
      - REDIS_URL=${REDIS_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      gallery-api:
        condition: service_started
      post-api:
        condition: service_started
      novel-api:
        condition: service_started
      emoji-api:
        condition: service_started
      redis:
        condition: service_started
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # Emoji Microservice
  emoji-api:
    build:
      context: ./emoji-api
      dockerfile: Dockerfile
    expose:
      - '5005'
    cpuset: "1"
    environment:
      - NODE_ENV=${NODE_ENV}
      - USER_SERVICE_URL=${USER_SERVICE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - MONGO_URI=${MONGO_URI}
      - MONGO_USER=${MONGO_USER}
      - MONGO_PW=${MONGO_PW}
      - REDIS_URL=${REDIS_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      user-api:
        condition: service_started
      redis:
        condition: service_started
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    volumes:
      - novel_uploads:/app/uploads
  # Novel/Episode Microservice
  novel-api:
    build:
      context: ./novel-api
      dockerfile: Dockerfile
    expose:
      - '5002'
    cpuset: "1"
    environment:
      - NODE_ENV=${NODE_ENV}
      - USER_SERVICE_URL=${USER_SERVICE_URL}
      - NOVEL_DB_HOST=${NOVEL_DB_HOST}
      - NOVEL_DB_USER=${NOVEL_DB_USER}
      - NOVEL_DB_PASSWORD=${NOVEL_DB_PASSWORD}
      - NOVEL_DB_NAME=${NOVEL_DB_NAME}
      - NOVEL_DB_PORT=${NOVEL_DB_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=${REDIS_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      user-api:
        condition: service_started
      redis:
        condition: service_started
      noveldb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5002/health || exit 1"]
    volumes:
      - novel_uploads:/app/uploads

  # MySQL Database for Novel/Episode Service
  noveldb:
    image: mysql:8.0
    cpuset: "3"
    environment:
      - MYSQL_ROOT_PASSWORD=${NOVEL_DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${NOVEL_DB_NAME}
    expose:
      - '3306'
    volumes:
      - noveldb_data:/var/lib/mysql
      - ./noveldb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${NOVEL_DB_ROOT_PASSWORD}"]
      timeout: 30s
      retries: 15
      interval: 10s
      start_period: 60s
    restart: unless-stopped
    networks:
      - app-network

  # User & Auth Microservice
  user-api:
    build:
      context: ./user-api
      dockerfile: Dockerfile
    expose:
      - '3001'
    volumes:
      - user_uploads:/app/uploads
    cpuset: "1"
    environment:
      - NODE_ENV=${NODE_ENV}
      - COOKIE_DOMAIN=.magicresearches.com
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
      - REQDB_HOST=${REQDB_HOST}
      - REQDB_USER=${REQDB_USER}
      - REQDB_PASSWORD=${REQDB_PASSWORD}
      - REQDB_NAME=${REQDB_NAME}
      - REQDB_PORT=${REQDB_PORT}
      - REDIS_URL=${REDIS_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - CAT_NAME=${CAT_NAME}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - BOT_ID=${BOT_ID}
      - BOT_PW=${BOT_PW}
      - BOT_EMAIL=${BOT_EMAIL}
    depends_on:
      userdb:
        condition: service_healthy
      requestdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3001/api/v1/health || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 120s

  # Frontend Service
  user:
    build:
      context: ./user
      dockerfile: Dockerfile
    expose:
      - '3000'
    volumes:
      - ./user/src:/app/src
      - ./user/package.json:/app/package.json
      - ./user/package-lock.json:/app/package-lock.json
      - ./user/tsconfig.json:/app/tsconfig.json
      - /app/node_modules
    cpuset: "1"
    environment:
      - NODE_ENV=${NODE_ENV}
      - COOKIE_DOMAIN=.magicresearches.com
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - REDIS_URL=${REDIS_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
  novel-frontend:
    build:
      context: ./novel-frontend
      dockerfile: Dockerfile
    expose:
      - '3100'
    environment:
      - NODE_ENV=${NODE_ENV}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
    restart: unless-stopped
    networks:
      - app-network

  community-frontend:
    build:
      context: ./community-frontend
      dockerfile: Dockerfile
    expose:
      - '3200'
    environment:
      - NODE_ENV=${NODE_ENV}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
    restart: unless-stopped
    networks:
      - app-network

  emoji-frontend:
    build:
      context: ./emoji-frontend
      dockerfile: Dockerfile
    expose:
      - '3300'
    environment:
      - NODE_ENV=${NODE_ENV}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
    restart: unless-stopped
    networks:
      - app-network
  research-frontend:
    build:
      context: ./research-frontend
      dockerfile: Dockerfile
    expose:
      - '3400'
    environment:
      - NODE_ENV=${NODE_ENV}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3300/health || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 90s

  # MySQL Database for User Service
  userdb:
    image: mysql:8.0
    cpuset: "3"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
    expose:
      - '3306'
    volumes:
      - userdb_data:/var/lib/mysql
      - ./userdb/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      timeout: 30s
      retries: 15
      interval: 10s
      start_period: 60s
    restart: unless-stopped
    networks:
      - app-network

  # Discord Bot Service
  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    command: sh -c "tsx ./src/index.ts"
    init: true
    cpuset: "2,3"
    environment:
      - NODE_ENV=${NODE_ENV}
      - USER_SERVICE_URL=${USER_SERVICE_URL}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_BOT_CLIENT_ID=${DISCORD_BOT_CLIENT_ID}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
      - BOT_ID=${BOT_ID}
      - BOT_EMAIL=${BOT_EMAIL}
      - BOT_PW=${BOT_PW}
      - BOT_NICKNAME=${BOT_NICKNAME}
    depends_on:
      user-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # MySQL Database for Request Tracking
  requestdb:
    image: mysql:8.0
    cpuset: "3"
    environment:
      - MYSQL_ROOT_PASSWORD=${REQDB_PASSWORD}
      - MYSQL_DATABASE=${REQDB_NAME}
    expose:
      - '3306'
    volumes:
      - requestdb_data:/var/lib/mysql
      - ./requestdb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${REQDB_PASSWORD}"]
      timeout: 30s
      retries: 15
      interval: 10s
      start_period: 60s
    restart: unless-stopped
    networks:
      - app-network

  # Redis for Session Management
  redis:
    image: redis:7-alpine
    cpuset: "2,3"
    expose:
      - '6379'
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./redis/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: |
        if [ -n "$REDIS_PASSWORD" ]; then
          redis-cli -a "$REDIS_PASSWORD" ping
        else
          redis-cli ping
        fi
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # MongoDB for Content Storage
  mongodb:
    image: mongo:4.4
    cpuset: "3"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PW}
    expose:
      - '27017'
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  userdb_data:
    driver: local
  requestdb_data:
    driver: local
  noveldb_data:
    driver: local
  redis_data:
    driver: local
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  user_uploads:
    driver: local
  novel_uploads:
    driver: local

networks:
  app-network:
    driver: bridge