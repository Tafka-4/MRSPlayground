events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s;

    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    # Cloudflare IPv4 ranges
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    # Cloudflare IPv6 ranges
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # Deprecated API gateway (to be removed)
    # upstream api_gateway {
    #     server api:5000;
    # }

    upstream novel_api {
        server novel-api:5002;
    }
    upstream gallery_api {
        server gallery-api:5001;
    }
    upstream post_api {
        server post-api:5003;
    }
    upstream comment_api {
        server comment-api:5004;
    }
    upstream emoji_api {
        server emoji-api:5005;
    }
    upstream research_api {
        server research-api:5100;
    }
    upstream user_api {
        server user-api:3001;
    }

    upstream frontend_user {
        server user:3000;
    }
    upstream frontend_novel {
        server novel-frontend:3100;
    }
    upstream frontend_community {
        server community-frontend:3200;
    }
    upstream frontend_emoji {
        server emoji-frontend:3300;
    }
    upstream frontend_research {
        server research-frontend:3400;
    }

    # WebSocket connection upgrade map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Allow underscores in headers
    underscores_in_headers on;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=15r/s;
    limit_req_zone $binary_remote_addr zone=logs:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=websocket:10m rate=2r/s;

    # File upload settings
    client_max_body_size 10M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Main server block for HTTP, redirects to HTTPS
    server {
        listen 80;
        server_name dev.magicresearches.com;
        return 301 https://$server_name$request_uri;
    }

    # API subdomain HTTP → HTTPS redirect
    server {
        listen 80;
        server_name api.magicresearches.com;
        return 301 https://$server_name$request_uri;
    }

    # Main server block for HTTPS
    server {
        listen 443 ssl http2;
        server_name dev.magicresearches.com;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # SSL settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Redirect API, WS and uploads on main domain to api subdomain
        location ^~ /api/ { return 308 https://api.magicresearches.com$request_uri; }
        location ^~ /ws/ { return 308 https://api.magicresearches.com$request_uri; }
        location ^~ /uploads/ { return 308 https://api.magicresearches.com$request_uri; }

        # WebSocket endpoints
        # New structured WS paths
        location /ws/user/logs {
            limit_req zone=websocket burst=3 nodelay;
            proxy_pass http://user_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header Authorization $http_authorization;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_connect_timeout 5s;
            proxy_buffering off;
            proxy_request_buffering off;
        }
        location /ws/user/keygen {
            limit_req zone=websocket burst=3 nodelay;
            proxy_pass http://user_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header Authorization $http_authorization;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_connect_timeout 5s;
            proxy_buffering off;
            proxy_request_buffering off;
        }
        location /ws/logs {
            limit_req zone=websocket burst=3 nodelay;
            
            proxy_pass http://user_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header Authorization $http_authorization;
            
            # WebSocket specific settings
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_connect_timeout 5s;
            
            # Disable buffering for real-time communication
            proxy_buffering off;
            proxy_request_buffering off;
        }

        location /ws/keygen {
            limit_req zone=websocket burst=3 nodelay;
            proxy_pass http://user_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header Authorization $http_authorization;

            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_connect_timeout 5s;
            
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # New structured User API prefix → user_api
        location ~ ^/api/user/v1/(.*)$ {
            limit_req zone=auth burst=30 nodelay;
            rewrite ^/api/user/v1/(.*)$ /api/v1/$1 break;
            proxy_pass http://user_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Request-ID $request_id;
            proxy_pass_request_headers on;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Legacy User API paths (kept for compatibility)
        # Auth Service
        location ~ ^/api/(auth)/v1(/.*)?$ {
            limit_req zone=auth burst=15 nodelay;
            
            rewrite ^/api/(auth)/v1(/.*)?$ /api/v1/auth$2 break;
